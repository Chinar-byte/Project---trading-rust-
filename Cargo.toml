[package]
name = "ferrum-exchange"
version = "0.1.0"
edition = "2024"
description = "A dependency-free limit order book, risk gate, and deterministic exchange simulator"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

